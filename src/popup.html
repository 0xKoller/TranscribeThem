<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="extName"></title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1 data-i18n="extName"></h1>
      <p class="tag" data-i18n="popupTag"></p>
    </header>

    <div id="companion-box" class="companion-card">
      <div class="companion-title">
        <span id="companion-dot" class="dot"></span>
        <span id="companion-status" data-i18n="companionChecking"></span>
      </div>
      <p id="companion-hint" class="companion-hint" data-i18n="companionHintDefault"></p>
    </div>

    <label>
      <span data-i18n="labelLanguage"></span>
      <select id="language">
        <option value="es" selected data-i18n="langEs"></option>
        <option value="en" data-i18n="langEn"></option>
        <option value="auto" data-i18n="langAuto"></option>
      </select>
    </label>

    <p id="error" class="error" hidden></p>

    <p class="footer">
      <button type="button" id="open-app" class="link-btn" data-i18n="openApp"></button>
      <button type="button" id="open-options" class="link-btn" data-i18n="openSettings"></button>
    </p>

    <script src="i18n.js"></script>
    <script src="messages.js"></script>
    <script src="settings.js"></script>
    <script src="companion-sync.js"></script>
    <script src="settings-ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
