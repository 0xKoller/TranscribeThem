<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optTitle"></title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="options">
    <header>
      <h1 data-i18n="extName"></h1>
      <p class="tag" data-i18n="optTag"></p>
    </header>

    <section class="panel">
      <h2 data-i18n="optWhere"></h2>
      <label class="debug-toggle">
        <input type="checkbox" id="site-whatsapp" checked />
        <span data-i18n="siteWhatsapp"></span>
      </label>
      <label class="debug-toggle">
        <input type="checkbox" id="site-x" checked />
        <span data-i18n="siteX"></span>
      </label>
      <p class="hint muted" data-i18n="siteHint"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="optHow"></h2>
      <label>
        <span data-i18n="labelLanguage"></span>
        <select id="language">
          <option value="es" selected data-i18n="langEs"></option>
          <option value="en" data-i18n="langEn"></option>
          <option value="auto" data-i18n="langAuto"></option>
        </select>
      </label>
      <p id="auto-hint" class="hint muted" data-i18n="optAutoHint" hidden></p>

      <p class="section-label" data-i18n="sectionEngine"></p>
      <div id="engines" class="models">
        <label class="model-card">
          <input type="radio" name="engine" value="auto" />
          <span class="model-card-body">
            <span class="model-card-title" data-i18n="engineAuto"></span>
            <span class="model-card-hint" data-i18n="engineAutoHint"></span>
          </span>
        </label>
        <label class="model-card">
          <input type="radio" name="engine" value="companion" />
          <span class="model-card-body">
            <span class="model-card-title" data-i18n="engineCompanion"></span>
            <span class="model-card-hint" data-i18n="engineCompanionHint"></span>
          </span>
        </label>
        <label class="model-card">
          <input type="radio" name="engine" value="browser" />
          <span class="model-card-body">
            <span class="model-card-title" data-i18n="engineBrowser"></span>
            <span class="model-card-hint" data-i18n="engineBrowserHint"></span>
          </span>
        </label>
      </div>

      <p class="section-label" data-i18n="sectionBrowserModel"></p>
      <div id="models" class="models"></div>
      <p id="gpu-warn" class="warn" hidden></p>
      <div id="progress" class="progress" hidden>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <p id="progress-label" class="progress-label"></p>
      </div>
    </section>

    <section class="panel">
      <h2 data-i18n="optOnNote"></h2>
      <label class="debug-toggle">
        <input type="checkbox" id="debug-mode" />
        <span data-i18n="showTiming"></span>
      </label>
      <label class="debug-toggle">
        <input type="checkbox" id="highlight-words" checked />
        <span data-i18n="highlightWords"></span>
      </label>
      <label class="debug-toggle">
        <input type="checkbox" id="auto-transcribe" />
        <span data-i18n="optAutoTranscribe"></span>
      </label>
      <p class="hint muted" data-i18n="optAutoTranscribeHint"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="savedHeading"></h2>
      <label class="debug-toggle">
        <input type="checkbox" id="cache-transcripts" checked />
        <span data-i18n="cacheTranscripts"></span>
      </label>
      <p class="hint muted" data-i18n="cacheHint"></p>
      <p>
        <button type="button" id="clear-transcripts" class="link-btn" data-i18n="clearTranscripts"></button>
        <span id="clear-transcripts-status" class="inline-status" role="status" hidden></span>
      </p>
    </section>

    <section class="panel">
      <h2 data-i18n="shortcutTitle"></h2>
      <p><strong id="shortcut-key">—</strong></p>
      <p class="hint muted" data-i18n="shortcutBody"></p>
    </section>

    <p id="error" class="error" hidden></p>

    <section class="panel">
      <h2 data-i18n="advanced"></h2>
      <dl class="status">
        <div>
          <dt data-i18n="labelWebgpu"></dt>
          <dd id="webgpu">…</dd>
        </div>
        <div>
          <dt data-i18n="labelCache"></dt>
          <dd id="cache">…</dd>
        </div>
        <div>
          <dt data-i18n="labelDevice"></dt>
          <dd id="device">—</dd>
        </div>
      </dl>
      <p><span data-i18n="modelInMemory"></span> <strong id="loaded-model">—</strong></p>
      <p><span data-i18n="optVersion"></span> <strong id="version">—</strong></p>
      <p data-i18n="optLocalPort"></p>
      <p><button type="button" id="open-app" class="link-btn" data-i18n="openTheApp"></button></p>
    </section>

    <section class="panel">
      <h2 data-i18n="privacy"></h2>
      <p data-i18n="privacyBody"></p>
      <p data-i18n="privacyDownload"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="noButton"></h2>
      <p data-i18n="noButtonBody"></p>
    </section>

    <script src="i18n.js"></script>
    <script src="messages.js"></script>
    <script src="settings.js"></script>
    <script src="companion-sync.js"></script>
    <script src="transcript-cache.js"></script>
    <script src="settings-ui.js"></script>
    <script src="options.js"></script>
  </body>
</html>
