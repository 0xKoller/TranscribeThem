<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WA Transcribe selector fixture</title>
    <link rel="stylesheet" href="../src/content.css" />
    <style>
      body {
        font-family: sans-serif;
        background: #0b141a;
        color: #e9edef;
        padding: 24px;
      }
      [data-testid="msg-container"] {
        background: #202c33;
        margin: 12px 0;
        padding: 12px;
        border-radius: 8px;
        max-width: 420px;
      }
      footer {
        margin-top: 24px;
        padding: 12px;
        background: #111b21;
      }
    </style>
  </head>
  <body>
    <h1>Fixture de notas de voz</h1>
    <p>Botón solo en burbujas del chat, nunca en el composer.</p>

    <div id="main">
      <div data-testid="conversation-panel-body">
        <div data-testid="msg-container">
          <div class="wa-bubble" style="background:#202c33;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px;">
            <div style="display:flex;flex-direction:row;align-items:center;gap:8px;">
              <span data-icon="audio-play"></span>
              <canvas width="80" height="20"></canvas>
              0:20
              <span>11:35</span>
            </div>
          </div>
        </div>

        <div data-testid="msg-container">
          <div class="wa-bubble" style="background:#005c4b;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px;">
            <div style="display:flex;flex-direction:row;align-items:center;gap:8px;">
              <span data-icon="audio-pause"></span>
              <canvas width="80" height="20"></canvas>
              0:16
              <span>11:36</span>
            </div>
          </div>
        </div>
      </div>

      <footer>
        Type a message
        <span data-icon="audio-play"></span>
        <button type="button">mic</button>
      </footer>
    </div>

    <p id="report"></p>

    <script>
      document.documentElement.setAttribute("data-wa-t-hook", "1");
      globalThis.chrome = {
        runtime: {
          sendMessage() {},
          onMessage: { addListener() {} },
          lastError: null,
        },
        storage: { local: { get: async () => ({}), set: async () => {} } },
      };
    </script>
    <script src="../src/messages.js"></script>
    <script src="../src/settings.js"></script>
    <script src="../src/errors.js"></script>
    <script src="../src/ui-mount.js"></script>
    <script src="../src/words.js"></script>
    <script src="../src/content.js"></script>
    <script>
      function reportInject() {
        const wraps = document.querySelectorAll(".wa-t-wrap");
        const inFooter = document.querySelectorAll("footer .wa-t-wrap");
        const inBubble = document.querySelectorAll(".wa-bubble > .wa-t-wrap");
        const nextToClock = [...document.querySelectorAll("[data-testid='msg-container']")].filter(
          (el) => [...el.children].some((c) => c.classList.contains("wa-t-wrap"))
        );
        const report = document.getElementById("report");
        report.textContent = `botones: ${wraps.length} (esperado 2); en footer: ${inFooter.length} (esperado 0); dentro del globo: ${inBubble.length} (esperado 2); al lado del reloj: ${nextToClock.length} (esperado 0)`;
      }
      (function wait(n) {
        if (document.querySelectorAll(".wa-t-wrap").length || n > 25) return reportInject();
        setTimeout(function () { wait(n + 1); }, 20);
      })(0);
    </script>
  </body>
</html>
