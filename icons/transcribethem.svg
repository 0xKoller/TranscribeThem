<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="TranscribeThem">
  <defs>
    <linearGradient id="voice" gradientUnits="userSpaceOnUse" x1="2.05" y1="0" x2="21.95" y2="0">
      <stop offset="0" stop-color="#E8B86D"/>
      <stop offset="0.48" stop-color="#EE9685"/>
      <stop offset="1" stop-color="#A5A7F2"/>
    </linearGradient>
  </defs>
  <!-- Stylized two-syllable “Ko-ller” envelope; not sampled speech. -->
  <style>
    .bar { transform-box: fill-box; transform-origin: center; animation: equalize 1.2s ease-in-out infinite; }
    @keyframes equalize { 0%,100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
  </style>
  <g fill="url(#voice)">
    <rect class="bar" x="2.05" y="11.25" width="0.7" height="1.5" rx="0.35" style="animation-delay: 0.00s"/>
    <rect class="bar" x="3.25" y="10.5" width="0.7" height="3" rx="0.35" style="animation-delay: -0.06s"/>
